resource: services
source:
  namespace: weavintelli
  name: server
target:
  namespace: test.*
modification:
  jsonpatch:
    - op: remove
      path: /spec/clusterIP
    - op: remove
      path: /spec/clusterIPs
  javascript: |
    resource.metadata.annotations = resource.metadata.annotations || {}
    resource.metadata.annotations['Hello'] = 'world'
    var ports = resource.spec.ports || []
    ports.forEach(function (port) {
      delete port.nodePort
    })
